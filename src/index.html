<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión de Empleados - Laravel + Angular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN (Temporal - para desarrollo) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Instrument Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            'laravel-red': '#F53003',
            'laravel-red-dark': '#FF4433',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Estilos base de Laravel */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Loader personalizado (opcional) */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FDFDFC;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    @media (prefers-color-scheme: dark) {
      .loading-screen {
        background: #0a0a0a;
      }
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #e3e3e0;
      border-top-color: #F53003;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @media (prefers-color-scheme: dark) {
      .loading-spinner {
        border-color: #3E3E3A;
        border-top-color: #FF4433;
      }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Ocultar el loader cuando Angular carga */
    app-root:not(:empty) ~ .loading-screen {
      display: none;
    }
  </style>
</head>
<body class="bg-[#FDFDFC] dark:bg-[#0a0a0a] text-[#1b1b18] dark:text-[#EDEDEC]">
  <app-root></app-root>
  
  <!-- Loader mientras carga Angular -->
  <div class="loading-screen">
    <div class="loading-spinner"></div>
  </div>
</body>
</html>
